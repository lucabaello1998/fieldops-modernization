name: Deploy (Fly)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    name: Deploy a Fly.io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # El secreto no se puede evaluar en el `if` del job, así que se chequea acá.
      - name: ¿Hay token configurado?
        id: token
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin FLY_API_TOKEN: se saltea el deploy (ver docs/deploy.md)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: flyctl
        if: steps.token.outputs.skip == 'false'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        if: steps.token.outputs.skip == 'false'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
